services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: norecipes
      POSTGRES_USER: norecipes
      POSTGRES_PASSWORD: norecipes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norecipes"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./database:/app/database
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --workers 3 --bind 0.0.0.0:8000 NorecipesAPI.wsgi:application"

volumes:
  postgres_data: